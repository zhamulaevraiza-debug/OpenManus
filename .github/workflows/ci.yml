name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/tool/chart_visualization/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for the browser tools
        run: |
          python -m playwright install --with-deps chromium
          chromium="$(python -c 'from playwright.sync_api import sync_playwright as p; s = p().start(); print(s.chromium.executable_path); s.stop()')"
          echo "PUPPETEER_EXECUTABLE_PATH=$chromium" >> "$GITHUB_ENV"

      - name: Install chart renderer dependencies
        working-directory: app/tool/chart_visualization
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: Run tests (Docker sandbox tests excluded)
        run: python -m pytest tests/core tests/tools tests/web tests/fake_llm deploy/tests -m "not docker" -q

  web:
    name: Web UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (desktop & mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install web dependencies and Chromium
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the e2e suite (fake LLM + web server + Playwright)
        run: PYTHON="$(command -v python)" scripts/e2e.sh --build

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: /tmp/openmanus-e2e-*/playwright/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Lint deployment scripts
        run: shellcheck deploy/*.sh

      - name: Validate compose and Caddy configuration
        run: |
          docker compose config -q
          docker compose --profile https config -q
          docker run --rm -e DOMAIN=example.com -e ACME_EMAIL=ci@example.org \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: openmanus-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: deploy/smoke-test.sh openmanus-web:ci
